# docker compose up --build  ->  http://localhost:8080
# The api collects ISU releases and press articles at start and every 30 minutes into the `data` volume;
# everyone who opens the page sees the same dataset. A new volume starts from the committed seed (isu/seed/).
# For UI development, `npm run backend` (web/) starts only the api, on 127.0.0.1:8000 (web/scripts/backend.mjs).
services:
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
      args:
        VISION: "${SAFEIASI_VISION:-1}"
    environment:
      SAFEIASI_REFRESH_MIN: "30"
      SAFEIASI_TRUST_DOCKER: "${SAFEIASI_TRUST_DOCKER:-0}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - data:/data
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    ports:
      - "8080:80"
    depends_on: [api]
    restart: unless-stopped
volumes:
  data:

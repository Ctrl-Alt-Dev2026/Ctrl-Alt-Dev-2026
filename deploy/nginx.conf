server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types application/json application/javascript text/css;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://api:8000;
    # Host with its port: the API's local-only routes compare it with the browser's Origin (localhost:4280).
    proxy_set_header Host $http_host;
    # Camera frames are up to 2 MiB, uploaded videos up to 64 MiB (safecross/jobs.py); the first inference
    # loads the models and can take tens of seconds on CPU.
    client_max_body_size 65m;
    proxy_read_timeout 180s;
  }
  # Hash routing: every route is index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
